<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thiru Murugan Store</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #176b45;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
}

nav {
    background: #104d32;
    padding: 12px;
    text-align: center;
}

nav button {
    background: white;
    color: #104d32;
    border: none;
    padding: 10px 18px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    padding: 20px;
}

h2 {
    text-align: center;
    color: #176b45;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px #ccc;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    border-radius: 8px;
}

.card h3 {
    color: #176b45;
}

.price {
    color: #444;
    font-weight: bold;
}

button {
    cursor: pointer;
}

.back-button {
    background: #176b45;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    margin-bottom: 20px;
}

footer {
    background: #104d32;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>Thiru Murugan Store</h1>
    <p>Welcome to Our Family Store</p>
</header>

<nav>
    <button onclick="showHome()">Home</button>
</nav>

<div class="container">

    <div id="home">
        <h2>Our Product Categories</h2>
        <div class="grid" id="categoryList"></div>
    </div>

    <div id="products" style="display:none;">
        <button class="back-button" onclick="showHome()">
            ← Back to Home
        </button>

        <h2 id="categoryTitle"></h2>

        <div class="grid" id="productList"></div>
    </div>

</div>

<footer>
    <p>Thank you for visiting Thiru Murugan Store!</p>
</footer>

<script>

// PRODUCT DETAILS

const products = {

    "Soap": [
        ["Lux", "lux.jpg"],
        ["Hamam", "hamam.jpg"],
        ["Cinthol", "cinthol.jpg"],
        ["Medimix", "medimix.jpg"],
        ["Dettol", "dettol.jpg"],
        ["Santoor", "santoor.jpg"],
        ["Lifebuoy", "lifebuoy.jpg"]
    ],

    "Shampoo": [
        ["Clinic Plus", "clinic-plus.jpg"],
        ["Sunsilk", "sunsilk.jpg"],
        ["Dove", "dove.jpg"],
        ["Head & Shoulders", "head-and-shoulders.jpg"],
        ["Pantene", "pantene.jpg"],
        ["Chik", "chik.jpg"],
        ["Meera", "meera.jpg"]
    ],

    "Cleaning Products": [
        ["Harpic", "harpic.jpg"],
        ["Lizol", "lizol.jpg"],
        ["Dettol", "dettol-cleaner.jpg"],
        ["Domex", "domex.jpg"],
        ["Vim", "vim.jpg"],
        ["Pril", "pril.jpg"],
        ["Surf Excel", "surf-excel.jpg"],
        ["Tide", "tide.jpg"],
        ["Rin", "rin.jpg"]
    ],

    "Snacks": [
        ["Lays", "lays.jpg"],
        ["Kurkure", "kurkure.jpg"],
        ["Bingo", "bingo.jpg"],
        ["Dairy Milk", "dairy-milk.jpg"],
        ["5 Star", "5-star.jpg"],
        ["KitKat", "kitkat.jpg"],
        ["Munch", "munch.jpg"]
    ],

    "Biscuits": [
        ["Good Day", "good-day.jpg"],
        ["Marie Gold", "marie-gold.jpg"],
        ["Parle-G", "parle-g.jpg"],
        ["50-50", "50-50.jpg"],
        ["Bourbon", "bourbon.jpg"],
        ["Oreo", "oreo.jpg"],
        ["Dark Fantasy", "dark-fantasy.jpg"],
        ["Milk Bikis", "milk-bikis.jpg"],
        ["Hide & Seek", "hide-and-seek.jpg"],
        ["Jim Jam", "jim-jam.jpg"]
    ],

    "Perfume": [
        ["Fogg", "fogg.jpg"],
        ["Axe", "axe.jpg"],
        ["Park Avenue", "park-avenue.jpg"]
    ]

};


// CATEGORY IMAGES

const categories = [
    ["Soap", "lux.jpg"],
    ["Shampoo", "clinic-plus.jpg"],
    ["Cleaning Products", "harpic.jpg"],
    ["Snacks", "lays.jpg"],
    ["Biscuits", "good-day.jpg"],
    ["Perfume", "fogg.jpg"]
];


// DISPLAY CATEGORIES

function showHome() {

    document.getElementById("home").style.display = "block";
    document.getElementById("products").style.display = "none";

    const categoryList = document.getElementById("categoryList");

    categoryList.innerHTML = "";

    categories.forEach(category => {

        categoryList.innerHTML += `
            <div class="card" onclick="showProducts('${category[0]}')">
                <img src="${category[1]}" alt="${category[0]}">
                <h3>${category[0]}</h3>
                <p>Click to view products</p>
            </div>
        `;

    });

}


// DISPLAY PRODUCTS

function showProducts(category) {

    document.getElementById("home").style.display = "none";
    document.getElementById("products").style.display = "block";

    document.getElementById("categoryTitle").innerText = category;

    const productList = document.getElementById("productList");

    productList.innerHTML = "";

    products[category].forEach(product => {

        productList.innerHTML += `
            <div class="card">
                <img src="${product[1]}" alt="${product[0]}">
                <h3>${product[0]}</h3>
                <p class="price">Price: Ask in Store</p>
            </div>
        `;

    });

}


// START WEBSITE

showHome();

</script>

</body>
</html>
